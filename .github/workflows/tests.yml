name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-versions }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        dependency-versions: ['prefer-lowest', 'prefer-stable']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # Pinned to the release the generated files were built against
            # (resources/tzdata-version.txt). Ubuntu's PHP is built --with-system-tzdata and
            # reports `0.system`, which no comparison can use; timezonedb replaces it with a
            # versioned copy so `composer sync-check` is a real check rather than a skipped one.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, intl, calendar, timezonedb-2026.1
          coverage: none
          ini-values: error_reporting=E_ALL, date.timezone=UTC

      - name: Report the runner's date data
        run: php -r 'printf("php tzdata=%s  icu=%s  icu tzdata=%s%s", timezone_version_get(), INTL_ICU_VERSION, IntlTimeZone::getTZDataVersion(), PHP_EOL);'

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.dependency-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependency-versions }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      # Excludes the tzdata group; those assertions track government decrees and run weekly
      # in tzdata.yml so a mid-sprint tzdata bump on the runner image cannot turn this red.
      - name: Run the suite
        run: composer test
