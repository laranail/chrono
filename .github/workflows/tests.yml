# Everything runs in the development container — the same image `make docker-test` builds.
#
# There is no second leg on the runner's own PHP. That is deliberate: a green tick and a green local
# run should mean the same thing, and they cannot while the two sit on different ICU versions. Every
# localised zone name and human date format comes from ICU, and its output moves between major
# releases.
#
# What that costs is honest to state: this no longer proves the package works on Debian's PHP, or on
# glibc, or on any ICU but the image's. The suite is not the only evidence — consumers run it on
# their own hosts — but a regression that only shows up off-Alpine would now reach a release.
#
# The dependency matrix survives the move, because that dimension was never about the host: it is
# Composer resolution, and `prefer-lowest` is what catches a constraint that is looser than the code.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    name: ${{ matrix.dependency-versions }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dependency-versions: ['prefer-lowest', 'prefer-stable']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container
        uses: ./.github/actions/container

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          if [ "${{ matrix.dependency-versions }}" = "prefer-lowest" ]; then
            docker/run composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            docker/run composer update --prefer-stable --no-interaction --no-progress
          fi

      # Excludes the tzdata group; those assertions track government decrees and run weekly in
      # tzdata.yml so a mid-sprint tzdata release cannot turn this red.
      - name: Run the suite
        run: docker/run composer test
