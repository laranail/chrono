# Keeps the development container from rotting.
#
# It is nobody's daily path — CI itself uses setup-php, which is faster — so without a job that
# builds it, the Dockerfile would quietly stop working and the next contributor who tried it would
# find that out instead of us.
#
# Only runs when something it depends on moves: the image definition, or the tz release it pins.

name: Dev container

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'resources/tzdata-version.txt'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'resources/tzdata-version.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the tz database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Through the same composite action every other workflow uses, so this shares their layer
      # cache and cannot drift onto a different base or a stale action pin.
      - name: Build the container
        uses: ./.github/actions/container

      # The Dockerfile already fails if timezonedb did not take, and the action reports what the
      # image carries. This proves the thing the image exists for: that the gate is real inside it.
      - name: The generated-data gate is real in there
        env:
          CI: 'true'
        run: docker/run php tools/sync-check.php
