name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · Pint · PHPStan · deptrac · Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # Pinned to the release the generated files were built against
            # (resources/tzdata-version.txt). Ubuntu's PHP is built --with-system-tzdata and
            # reports `0.system`, which no comparison can use; timezonedb replaces it with a
            # versioned copy so `composer sync-check` is a real check rather than a skipped one.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, calendar, timezonedb-2026.1
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-static-${{ hashFiles('composer.json') }}
          restore-keys: composer-static-

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Parallel lint
        run: composer parallel-lint

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (shell level 8, core level 10 + strict)
        run: composer phpstan

      # Runs through tools/deptrac-guard.php, not deptrac directly: deptrac exits 0 when it
      # cannot parse a file, which would leave the Core boundary silently unenforced.
      - name: deptrac (architecture boundary)
        run: composer deptrac

      - name: Rector (dry run, php85 set)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      # Fails when the committed generated enums and maps disagree with the runner's tzdata.
      - name: Generated data is in sync
        run: composer sync-check
