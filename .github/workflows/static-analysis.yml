# Runs in the development container, so `make docker-lint` and this are the same thing.
#
# Static analysis has no platform dimension worth testing — PHPStan reads types, not a tz database —
# but `sync-check` does, and it is the reason this moved. Byte-for-byte parity of the generated data
# only means something on a host carrying the release those files were built against, and the image
# carries it by construction: no extension pin to thread through, no way for the gate to skip while
# still reporting green.

name: Static analysis

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint · Pint · PHPStan · deptrac · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container
        uses: ./.github/actions/container

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          docker/run composer update --prefer-stable --no-interaction --no-progress

      - name: Parallel lint
        run: docker/run composer parallel-lint

      - name: Pint (code style)
        run: docker/run vendor/bin/pint --test

      - name: PHPStan (shell level 8, core level 10 + strict)
        run: docker/run composer phpstan

      # deptrac is pinned to ^4.7 because 3.0 cannot parse PHP 8.5's clone-with and reports a parse
      # error while still exiting 0 — see docs/architecture.md. The guard fails on parse errors.
      - name: deptrac (architecture boundary)
        run: docker/run composer deptrac

      - name: Rector (dry run, php85 set)
        run: docker/run vendor/bin/rector process --dry-run --no-progress-bar

      # A real comparison here, not a skipped one: the image carries the release the files describe.
      - name: Generated data is in sync
        env:
          CI: 'true'
        run: docker/run composer sync-check
