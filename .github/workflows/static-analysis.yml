# Runs in the development container, so `make docker-lint` and this are the same thing.
#
# Static analysis has no platform dimension worth testing — PHPStan reads types, not a tz database —
# but `sync-check` does, and it is the reason this moved. Byte-for-byte parity of the generated data
# only means something on a host carrying the release those files were built against, and the image
# carries it by construction: no extension pin to thread through, no way for the gate to skip while
# still reporting green.

name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Lint · Pint · PHPStan · deptrac · Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Shares the layer cache with the tests workflow, so only one of them pays for a rebuild.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: chrono-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what it carries
        run: |
          docker run --rm chrono-dev php -r \
            'printf("php %s  tzdata %s  icu %s\n", PHP_VERSION, timezone_version_get(), INTL_ICU_VERSION);'

      - name: Install dependencies
        run: |
          docker run --rm -v "$PWD:/app" -w /app chrono-dev \
            composer update --prefer-stable --no-interaction --no-progress

      - name: Parallel lint
        run: docker run --rm -v "$PWD:/app" -w /app chrono-dev composer parallel-lint

      - name: Pint (code style)
        run: docker run --rm -v "$PWD:/app" -w /app chrono-dev vendor/bin/pint --test

      - name: PHPStan (shell level 8, core level 10 + strict)
        run: docker run --rm -v "$PWD:/app" -w /app chrono-dev composer phpstan

      # deptrac is pinned to ^4.7 because 3.0 cannot parse PHP 8.5's clone-with and reports a parse
      # error while still exiting 0 — see docs/architecture.md. The guard fails on parse errors.
      - name: deptrac (architecture boundary)
        run: docker run --rm -v "$PWD:/app" -w /app chrono-dev composer deptrac

      - name: Rector (dry run, php85 set)
        run: docker run --rm -v "$PWD:/app" -w /app chrono-dev vendor/bin/rector process --dry-run --no-progress-bar

      # A real comparison here, not a skipped one: the image carries the release the files describe.
      - name: Generated data is in sync
        run: docker run --rm -v "$PWD:/app" -w /app -e CI=true chrono-dev composer sync-check
