name: tzdata drift

# The IANA database changes several times a year by government decree — Morocco's Ramadan shifts,
# Iran, Chile, Egypt, Fiji. Those assertions live in the `tzdata` group, excluded from the main
# suite so a runner-image bump mid-sprint cannot turn the build red. This job runs them weekly and
# opens an issue instead of failing anyone's PR.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Decree-driven fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container
        uses: ./.github/actions/container

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: docker/run composer update --prefer-stable --no-interaction --no-progress

      - name: Record the container's date data
        id: versions
        run: |
          {
            echo "php_tzdata=$(docker run --rm chrono-dev php -r 'echo timezone_version_get();')"
            echo "icu=$(docker run --rm chrono-dev php -r 'echo INTL_ICU_VERSION;')"
            echo "icu_tzdata=$(docker run --rm chrono-dev php -r 'echo IntlTimeZone::getTZDataVersion();')"
          } >> "$GITHUB_OUTPUT"

      # No separate pin guard: the image fails its own build unless PHP reports the pinned release,
      # so reaching this step at all means the database is the one the fixtures describe.

      - name: Run the tzdata group
        id: run
        continue-on-error: true
        run: docker/run composer test-tzdata

      - name: Open an issue on drift
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'tzdata drift detected';
            const body = [
              'The weekly `tzdata` fixture run failed, which means the IANA database changed: this job',
                'runs against a versioned `timezonedb`, so the comparison is real.',
              '',
              `- PHP tzdata: \`${{ steps.versions.outputs.php_tzdata }}\``,
              `- ICU: \`${{ steps.versions.outputs.icu }}\` (ICU tzdata \`${{ steps.versions.outputs.icu_tzdata }}\`)`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the diff, then run `laranail::chrono.sync` and update the affected fixtures.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'tzdata',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['tzdata'],
              });
            }
