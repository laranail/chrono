name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the container
        uses: ./.github/actions/container

      - name: Install runtime dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: docker/run composer install --no-dev --no-interaction --no-progress

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: chrono.cdx.json
          artifact-name: chrono.cdx.json

      # Every release carries a real description, sourced from this version's CHANGELOG section.
      - name: Extract the changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A tag with no CHANGELOG section used to publish an empty release. Refuse instead.
          notes=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION; a release without real notes is incomplete." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo ''
            echo "**Full changelog:** https://github.com/laranail/chrono/blob/main/CHANGELOG.md"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: chrono.cdx.json
