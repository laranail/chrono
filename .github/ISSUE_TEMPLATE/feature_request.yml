name: Feature request
description: Suggest a capability.
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: A sketch of the API, if you have one.
      render: php

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: Existing workarounds, and why they fall short.
