# Builds the development image and loads it into the runner's daemon.
#
# Extracted because five workflows now need it, and five copies of a build step is five chances for
# one of them to drift onto a different base, a different cache key, or a stale action pin — which
# would quietly reintroduce the environment split this container exists to close.
#
# Layers are cached across runs *and* across workflows, so only the first job to run after a change
# to docker/ or the tz pin pays for a rebuild. Nothing is pushed: the image is loaded locally and
# discarded with the runner.

name: Development container
description: Build the tzdata-pinned image and load it as chrono-dev

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: docker/Dockerfile
        load: true
        tags: chrono-dev
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Printed once per job so the environment behind a result is in the log rather than inferred.
    - name: Report what it carries
      shell: bash
      run: |
        docker run --rm chrono-dev php -r \
          'printf("php %s  tzdata %s  icu %s  icu tzdata %s\n", PHP_VERSION, timezone_version_get(), INTL_ICU_VERSION, IntlTimeZone::getTZDataVersion());'
